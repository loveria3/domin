<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>강지애의 경조사비 장부</title>
<style>
:root{--bg:#f4ecdc;--panel:#fffaf0;--ink:#2b2318;--sub:#6a5b45;--line:#ddcdb0;--blue:#0b5cc4;--green:#11713a;--accent:#1f4d33;--accent-ink:#ffffff;--ghost:#ebe0c9;--danger:#a8231b;--warn:#fff1cf;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1b1812;--panel:#26221a;--ink:#f2ebdd;--sub:#bfb096;--line:#463e30;--blue:#82b6ff;--green:#74d69f;--accent:#5fae7c;--accent-ink:#0f1f14;--ghost:#3a3328;--danger:#ff9a92;--warn:#3b3318}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1b1812;--panel:#26221a;--ink:#f2ebdd;--sub:#bfb096;--line:#463e30;--blue:#82b6ff;--green:#74d69f;--accent:#5fae7c;--accent-ink:#0f1f14;--ghost:#3a3328;--danger:#ff9a92;--warn:#3b3318}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Nanum Gothic",sans-serif;font-size:21px;line-height:1.55}
main{max-width:760px;margin:0 auto;padding:22px 16px 56px}
h1{font-size:34px;line-height:1.25;margin:8px 0 20px;letter-spacing:-0.02em}
h2{font-size:26px;margin:0 0 16px}
section{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.full{grid-column:1/-1}
label{display:block;font-weight:700;margin-bottom:8px}
input,select{width:100%;font:inherit;font-size:23px;min-height:60px;padding:12px 16px;border:2px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button{font:inherit;font-size:24px;font-weight:700;border:0;border-radius:22px;min-height:64px;padding:16px 22px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
button.ghost{background:var(--ghost);color:var(--ink);border:2px solid var(--line)}
button.small{font-size:20px;min-height:52px;padding:10px 18px;border-radius:999px}
button.danger{background:var(--danger);color:var(--bg)}
.hint{display:block;font-size:17px;color:var(--sub);margin-top:6px;font-weight:400}
.msg{min-height:1.6em;margin:12px 0 0;font-weight:700}
.msg.err{color:var(--danger)}
/* 목록 — 낸 돈 칸 · 받은 돈 칸을 나눠 세로로 훑어보기, 맨 아래 합계 줄 */
.led{margin-top:14px;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.lr{display:grid;grid-template-columns:1fr 7.2em 7.2em;grid-template-areas:"w g t" "x g t";border-top:1px solid var(--line)}
.lr:first-child{border-top:0}
.lr .who{grid-area:w;padding:14px 12px 4px}
.lr .who b{display:block;font-size:24px}
.lr .who span{display:block;font-size:17px;color:var(--sub)}
.lr .g,.lr .t{display:flex;align-items:center;justify-content:flex-end;padding:10px;font-weight:800;font-size:23px;white-space:nowrap}
.lr .g{grid-area:g;color:var(--blue);background:rgba(11,92,196,.07)}
.lr .t{grid-area:t;color:var(--green);background:rgba(17,113,58,.08)}
.lr .acts{grid-area:x;padding:4px 12px 14px}
.lr .ask{grid-column:1/-1;grid-row:3;margin:0 12px 14px}
.lr.hd,.lr.ft{grid-template-areas:"w g t";font-weight:800}
.lr.hd{background:var(--ghost);font-size:18px}.lr.hd .who{padding:12px}.lr.hd .g,.lr.hd .t{font-size:18px;background:none}
.lr.ft{border-top:2px solid var(--line);background:var(--ghost)}.lr.ft .who{padding:14px 12px;font-size:20px}
.out{color:var(--blue)}.in{color:var(--green)}
.ask{grid-column:1/-1;background:var(--warn);border-radius:16px;padding:14px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.ask b{flex:1 1 100%}
.empty{color:var(--sub);padding:8px 0}
.amtrow{display:flex;gap:12px}.amtrow input{flex:1 1 auto;min-width:0}.quick{flex:none;padding:12px 18px;font-size:22px;border-radius:999px}.acts{display:flex;gap:14px}
#bkask .ask{margin-top:14px}
.btnrow{display:flex;gap:14px}.btnrow button{flex:1 1 0}.btnrow #cancel{flex:0 1 38%}
#q{font-size:25px;padding:16px;-webkit-appearance:none;appearance:none}
.sums{margin:18px 0 10px}.sumhead{color:var(--sub);font-size:18px;margin-bottom:8px}.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.sumbox{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:14px 16px}.sumbox span{display:block;font-size:18px;color:var(--sub);font-weight:700}.sumbox b{display:block;font-size:clamp(22px,6vw,32px);line-height:1.3;overflow-wrap:anywhere}
.top{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:8px}
.jump{display:block;text-align:right;padding:10px 4px;margin-bottom:12px;font-size:20px;font-weight:700;color:var(--accent)}
.topbox{background:var(--panel);border:3px solid currentColor;border-radius:20px;padding:18px}
.topbox span{display:block;font-size:20px;font-weight:700}
.topbox b{display:block;font-size:clamp(22px,6.4vw,38px);line-height:1.35;overflow-wrap:anywhere}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:left}
thead th{color:var(--sub);font-size:18px}
.num{text-align:right;white-space:nowrap;font-weight:700}
tfoot th,tfoot td{font-weight:800;border-bottom:0;border-top:2px solid var(--line)}
@media (max-width:520px){.sumgrid{gap:10px}.sumbox{padding:12px}.topbox{padding:14px 12px}.top{gap:10px}table{font-size:19px}th,td{padding:11px 5px}}
.count{color:var(--sub);font-size:18px;font-weight:400}
@media (max-width:520px){.grid{grid-template-columns:1fr;gap:16px}h1{font-size:28px}section{padding:18px 14px}
  .lr{grid-template-columns:1fr 88px 88px;grid-template-areas:"w g t" "x x x"}.lr .who{padding:12px 8px 6px}.lr .who b{font-size:21px}.lr .who span{font-size:15px}
  .lr .g,.lr .t{font-size:17px;padding:8px 6px}.lr .acts{padding:0 8px 12px;gap:8px}.lr .acts button{flex:1 1 0;padding:8px 6px;font-size:18px;min-height:48px}
  .lr.hd .g,.lr.hd .t{font-size:16px}.lr.ft .who{font-size:18px}
  .amtrow{flex-wrap:wrap}.amtrow input{flex:1 1 100%}.quick{flex:1 1 0}
  .btnrow{flex-direction:column}.btnrow #cancel{flex:none}}
</style>
</head>
<body>
<main>
<h1>강지애의 경조사비 장부</h1>

<div class="top" aria-label="올해 합계"><div class="topbox out"><span>올해 낸 돈</span><b id="topout">0원</b></div><div class="topbox in"><span>올해 받은 돈</span><b id="topin">0원</b></div></div>
<a class="jump" href="#h-year">다른 해 합계 보기 ↓</a>

<section aria-labelledby="h-write">
<h2 id="h-write">새로 적기</h2>
<div class="grid">
<div class="full"><label for="name">이름</label><input id="name" type="text" autocomplete="off" placeholder="예: 고순덕"></div>
<div><label for="rel">관계</label><select id="rel"><option>가족</option><option>친척</option><option selected>친구</option><option>직장</option><option>이웃</option><option>기타</option></select></div>
<div><label for="ev">행사</label><select id="ev"><option selected>결혼</option><option>장례</option><option>돌잔치</option><option>칠순팔순</option><option>개업</option><option>기타</option></select></div>
<div><label for="date">날짜</label><input id="date" type="date"></div>
<div><label for="dir">주고받음</label><select id="dir"><option>냈음</option><option>받았음</option></select></div>
<div class="full"><label for="amt">금액 (원)</label><div class="amtrow"><input id="amt" type="text" inputmode="numeric" autocomplete="off" placeholder="예: 50,000"><button class="ghost quick" type="button" data-v="30000" title="금액 칸에 30,000원을 넣어요">3만</button><button class="ghost quick" type="button" data-v="50000" title="금액 칸에 50,000원을 넣어요">5만</button><button class="ghost quick" type="button" data-v="100000" title="금액 칸에 100,000원을 넣어요">10만</button></div><span class="hint">3만, 5만, 10만 단추를 누르면 그 금액이 금액 칸에 바로 들어가요</span></div>
<div class="full btnrow"><button id="add" type="button"><span id="addlabel">적기</span><span id="addhint" class="hint" style="color:inherit;opacity:.85">누르면 위 내용이 아래 목록에 한 줄 추가돼요</span></button><button id="cancel" class="ghost" type="button" hidden>취소<span class="hint">고치던 내용을 버리고 목록은 그대로 둬요</span></button></div>
</div>
<p id="msg" class="msg" role="status" aria-live="polite"></p>
</section>

<section aria-labelledby="h-list">
<h2 id="h-list">적은 기록 <span id="count" class="count"></span></h2>
<label for="q">이름으로 찾기</label>
<input id="q" type="search" autocomplete="off" placeholder="이름 한 글자만 쳐도 바로 걸러져요">
<div class="sums" aria-live="polite"><div class="sumhead" id="sumwho"></div><div class="sumgrid"><div class="sumbox"><span>내가 낸 돈 합계</span><b id="sumout" class="out">0원</b></div><div class="sumbox"><span>받은 돈 합계</span><b id="sumin" class="in">0원</b></div></div></div>
<div id="list"></div>
</section>

<section aria-labelledby="h-year">
<h2 id="h-year">연도별 합계</h2>
<label for="year">연도 고르기</label>
<select id="year"></select>
<div class="sums" aria-live="polite"><div class="sumgrid"><div class="sumbox"><span>그 해에 낸 돈 합계</span><b id="yout" class="out">0원</b></div><div class="sumbox"><span>그 해에 받은 돈 합계</span><b id="yin" class="in">0원</b></div></div></div>
<h3 style="font-size:21px;margin:18px 0 0">행사별 합계</h3>
<div class="tablewrap"><table><thead><tr><th>행사</th><th class="num">낸 돈</th><th class="num">받은 돈</th></tr></thead><tbody id="evbody"></tbody><tfoot><tr><th scope="row">합계</th><td class="num out" id="evout">0원</td><td class="num in" id="evin">0원</td></tr></tfoot></table></div>
</section>

<section aria-labelledby="h-backup">
<h2 id="h-backup">백업</h2>
<p class="hint" style="margin:0 0 14px">장부는 이 컴퓨터의 이 브라우저에만 저장돼요. 백업 파일로 받아 두면 폰이나 다른 컴퓨터에서 불러와 이어 쓸 수 있어요.</p>
<div class="btnrow bk"><button id="bkdown" type="button">백업 받기<span class="hint" style="color:inherit;opacity:.85">장부 전체를 엑셀에서 열리는 파일로 내려받아요</span></button><button id="bkup" class="ghost" type="button">백업 불러오기<span class="hint">받아 둔 백업 파일을 골라요</span></button></div>
<input id="bkfile" type="file" accept=".xlsx,.xls,.csv,.json" hidden>
<div id="bkask"></div>
<p id="bkmsg" class="msg" role="status" aria-live="polite"></p>
</section>

<section aria-labelledby="h-demo">
<h2 id="h-demo">연습해 보기</h2>
<button id="demo" class="ghost" type="button">연습 기록 10개 넣기<span class="hint">제주 느낌의 가상 이름 기록 10줄을 목록에 더해요. 지우기로 하나씩 지울 수 있어요</span></button>
<p style="margin:22px 0 0;text-align:right"><button id="wipe" class="small ghost" type="button">전부 지우기</button></p>
<p id="wipemsg" class="msg" role="status" aria-live="polite"></p>
</section>
</main>

<script>
var KEY="gyeongjosa-ledger-v1", items=[], pending=null, editingId=null, okTimer=null;
function load(){try{var r=localStorage.getItem(KEY);if(r){var a=JSON.parse(r);if(Array.isArray(a))items=a;}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items));}catch(e){}}
function won(n){return Number(n).toLocaleString("en-US")+"원";}
function $(id){return document.getElementById(id);}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function today(){var d=new Date(),m=d.getMonth()+1,day=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day;}
function say(t,err,ms){var m=$("msg");clearTimeout(okTimer);m.textContent=t;m.className="msg"+(err?" err":"");if(ms){okTimer=setTimeout(function(){m.textContent="";},ms);}}

var EVS=["결혼","장례","돌잔치","칠순팔순","개업","기타"],thisYear=String(new Date().getFullYear()),selYear=thisYear,yearsSig="";
function yr(x){return String(x.date||"").slice(0,4);}
function sumBy(arr){var o=0,r=0;arr.forEach(function(x){if(x.dir==="냈음")o+=x.amt;else r+=x.amt;});return[o,r];}
function renderSums(){
  var ty=sumBy(items.filter(function(x){return yr(x)===thisYear;}));
  $("topout").textContent=won(ty[0]);$("topin").textContent=won(ty[1]);
  var ys={};ys[thisYear]=1;items.forEach(function(x){ys[yr(x)]=1;});
  var years=Object.keys(ys).sort().reverse();
  if(years.indexOf(selYear)<0)selYear=thisYear;
  var sel=$("year"),sig=years.join(",");
  if(sig!==yearsSig){sel.textContent="";years.forEach(function(y){var o=el("option","",y+"년");o.value=y;sel.appendChild(o);});yearsSig=sig;}
  sel.value=selYear;
  var yi=items.filter(function(x){return yr(x)===selYear;}),t=sumBy(yi);
  $("yout").textContent=won(t[0]);$("yin").textContent=won(t[1]);
  var tb=$("evbody");tb.textContent="";
  EVS.forEach(function(ev){
    var s=sumBy(yi.filter(function(x){return x.ev===ev;})),tr=el("tr"),h=el("th","",ev);h.scope="row";
    tr.appendChild(h);tr.appendChild(el("td","num out",s[0]?won(s[0]):"-"));tr.appendChild(el("td","num in",s[1]?won(s[1]):"-"));tb.appendChild(tr);
  });
  $("evout").textContent=won(t[0]);$("evin").textContent=won(t[1]);
}
function render(){
  renderSums();
  var list=$("list");list.textContent="";
  var q=$("q").value.trim().toLowerCase();
  var sorted=items.filter(function(x){return !q||x.name.toLowerCase().indexOf(q)>=0;}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1);});
  var so=0,sr=0;sorted.forEach(function(x){if(x.dir==="냈음")so+=x.amt;else sr+=x.amt;});
  $("sumout").textContent=won(so);$("sumin").textContent=won(sr);
  $("sumwho").textContent=q?"찾은 "+sorted.length+"줄의 합계":"전체 "+items.length+"줄의 합계";
  $("count").textContent=q?"("+sorted.length+"줄 찾음 / 전체 "+items.length+"줄)":(sorted.length?"("+sorted.length+"줄)":"");
  if(!sorted.length){list.appendChild(el("p","empty",items.length?"찾는 이름이 없어요. 찾기 칸의 글자를 고쳐 보세요.":"아직 적은 기록이 없어요. 위에서 적거나, 아래 연습 기록을 넣어 보세요."));return;}
  function num(n){return Number(n).toLocaleString("en-US");}
  var led=el("div","led");list.appendChild(led);
  var hd=el("div","lr hd");hd.appendChild(el("div","who","이름 · 행사"));hd.appendChild(el("div","g","낸 돈"));hd.appendChild(el("div","t","받은 돈"));led.appendChild(hd);
  sorted.forEach(function(it){
    var row=el("div","lr");
    var who=el("div","who");who.appendChild(el("b","",it.name));who.appendChild(el("span","",it.rel+" · "+it.ev+" · "+it.date));row.appendChild(who);
    row.appendChild(el("div","g",it.dir==="냈음"?num(it.amt):""));
    row.appendChild(el("div","t",it.dir==="냈음"?"":num(it.amt)));
    if(pending===it.id){
      var ask=el("div","ask");ask.appendChild(el("b","","이 기록을 정말 지울까요? 지우면 되돌릴 수 없어요."));
      var yes=el("button","small danger","네, 지웁니다");yes.type="button";
      yes.onclick=function(){items=items.filter(function(x){return x.id!==it.id;});pending=null;if(editingId===it.id)stopEdit(true);save();render();say("한 줄을 지웠어요.");};
      var no=el("button","small ghost","아니요, 그대로 둡니다");no.type="button";
      no.onclick=function(){pending=null;render();};
      ask.appendChild(yes);ask.appendChild(no);row.appendChild(ask);
    }else{
      var acts=el("div","acts del");
      var ed=el("button","small ghost","고치기");ed.type="button";ed.title="이 줄 내용을 위 적는 칸에 다시 올려요";
      ed.setAttribute("aria-label",it.name+" 기록 고치기");
      ed.onclick=function(){startEdit(it);};
      var d=el("button","small ghost","지우기");d.type="button";d.title="이 줄을 지울지 물어봐요";
      d.setAttribute("aria-label",it.name+" 기록 지우기");
      d.onclick=function(){pending=it.id;render();};
      acts.appendChild(ed);acts.appendChild(d);row.appendChild(acts);
    }
    led.appendChild(row);
  });
  var ft=el("div","lr ft");ft.appendChild(el("div","who","합계 ("+sorted.length+"줄)"));ft.appendChild(el("div","g",num(so)));ft.appendChild(el("div","t",num(sr)));led.appendChild(ft);
}

$("amt").addEventListener("input",function(){
  var d=this.value.replace(/[^0-9]/g,"").replace(/^0+/,"");
  this.value=d?Number(d).toLocaleString("en-US"):"";
});

$("add").onclick=function(){
  var name=$("name").value.trim(),date=$("date").value,amt=Number($("amt").value.replace(/,/g,""));
  var miss=[];if(!name)miss.push("이름");if(!amt)miss.push("금액");
  if(miss.length){say(miss.join("과 ")+"이 비어 있어요. 채운 뒤 적기를 다시 눌러 주세요. 아직 적지 않았어요.",true);(!name?$("name"):$("amt")).focus();return;}
  if(!date){say("날짜를 골라 주세요. 아직 적지 않았어요.",true);$("date").focus();return;}
  var rec={name:name,rel:$("rel").value,ev:$("ev").value,date:date,amt:amt,dir:$("dir").value};
  if(editingId){items=items.map(function(x){return x.id===editingId?Object.assign({id:x.id},rec):x;});}
  else{rec.id=newId();items.push(rec);}
  var wasEdit=!!editingId;stopEdit(false);
  if($("q").value.trim()&&name.toLowerCase().indexOf($("q").value.trim().toLowerCase())<0)$("q").value="";
  save();render();
  $("name").value="";$("amt").value="";$("name").focus();
  say(wasEdit?"고쳤습니다 ✔":"적었습니다 ✔",false,2000);
};

$("demo").onclick=function(){
  var s=[["고순덕","친구","결혼","2026-10-11",100000,"냈음"],["양춘자","친척","칠순팔순","2026-09-20",200000,"냈음"],["부영훈","직장","장례","2026-08-30",50000,"냈음"],["한동백","가족","결혼","2026-06-14",300000,"받았음"],["고하영","이웃","돌잔치","2026-05-03",30000,"냈음"],["양해진","친구","개업","2026-03-22",100000,"냈음"],["문태풍","직장","결혼","2026-02-07",50000,"받았음"],["오돌래","친척","장례","2025-12-19",100000,"받았음"],["강바다","친구","돌잔치","2025-10-05",50000,"냈음"],["송유채","이웃","장례","2025-07-27",50000,"받았음"]];

function setMode(editing){$("addlabel").textContent=editing?"고치기 완료":"적기";$("addhint").textContent=editing?"누르면 위 내용으로 그 줄만 바뀌어요":"누르면 위 내용이 아래 목록에 한 줄 추가돼요";$("cancel").hidden=!editing;}
function stopEdit(clearForm){editingId=null;setMode(false);if(clearForm){$("name").value="";$("amt").value="";}}
function startEdit(it){
  editingId=it.id;pending=null;
  $("name").value=it.name;$("rel").value=it.rel;$("ev").value=it.ev;$("date").value=it.date;
  $("amt").value=Number(it.amt).toLocaleString("en-US");$("dir").value=it.dir;

}

// ---- 백업 받기 · 불러오기 ----
function bksay(t,err){var m=$("bkmsg");m.textContent=t;m.className="msg"+(err?" err":"");}
$("bkdown").onclick=function(){
  if(!items.length){bksay("아직 적은 기록이 없어서 받을 내용이 없어요.",true);return;}
  bksay("엑셀 파일을 만드는 중이에요…");
  needXLSX(function(){
    var rows=[COLS].concat(items.slice().sort(function(a,b){return a.date<b.date?1:-1;}).map(function(x){return[x.date,x.name,x.rel,x.ev,x.dir,x.amt];}));
    var ws=XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"]=[{wch:12},{wch:12},{wch:8},{wch:10},{wch:9},{wch:12}];
    for(var i=1;i<rows.length;i++){var c=ws[XLSX.utils.encode_cell({r:i,c:5})];if(c)c.z="#,##0";}   // 금액에 쉼표
    var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"장부");
    XLSX.writeFile(wb,"경조사비장부_백업_"+today()+".xlsx");
    bksay("백업 파일을 내려받았어요 ✔ ("+items.length+"줄) 다운로드 폴더에서 더블클릭하면 엑셀로 열려요.");
  });
};
var COLS=["날짜","이름","관계","행사","주고받음","금액"];
// 엑셀 파일을 만들고 읽는 도구(SheetJS) — 백업 단추를 누를 때만 불러옴
function needXLSX(ok){
  if(window.XLSX)return ok();
  var s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
  s.onload=ok;s.onerror=function(){s.remove();bksay("엑셀 도구를 불러오지 못했어요. 인터넷에 연결된 상태에서 다시 눌러 주세요.",true);};
  document.head.appendChild(s);
}
function parseCSV(t){
  var rows=[],row=[],f="",q=false,sep=t.split("\n")[0].indexOf("\t")>=0?"\t":",";
  for(var i=0;i<t.length;i++){var c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===sep){row.push(f);f="";}
    else if(c==="\n"){row.push(f);rows.push(row);row=[];f="";}
    else if(c!=="\r")f+=c;}
  if(f||row.length){row.push(f);rows.push(row);}
  return rows.filter(function(r){return r.join("").trim();});
}
function p2(n){return("0"+n).slice(-2);}
function fromRows(rows){
  rows=rows.filter(function(r){return r&&r.join("").trim();});if(!rows.length)return[];
  var h=rows[0].map(function(s){return String(s==null?"":s).trim();}),at={};
  COLS.forEach(function(c,i){var k=h.indexOf(c);at[c]=k>=0?k:i;});
  return rows.slice(h.indexOf("이름")>=0?1:0).map(function(r){
    function g(c){var v=r[at[c]];return v==null?"":v;}
    var dv=g("날짜"),date="";
    if(dv instanceof Date)date=dv.getFullYear()+"-"+p2(dv.getMonth()+1)+"-"+p2(dv.getDate());   // 엑셀에서 날짜로 바뀐 칸
    else{var d=String(dv).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);if(d)date=d[1]+"-"+p2(d[2])+"-"+p2(d[3]);}
    return{name:String(g("이름")).trim(),rel:String(g("관계")).trim(),ev:String(g("행사")).trim(),dir:String(g("주고받음")).trim(),
      amt:String(g("금액")).replace(/[^0-9.]/g,""),date:date};
  });
}
function fromCSV(t){return fromRows(parseCSV(t.replace(/^﻿/,"")));}
function decode(buf){try{return new TextDecoder("utf-8",{fatal:true}).decode(buf);}catch(e){return new TextDecoder("euc-kr").decode(buf);}}
$("bkup").onclick=function(){$("bkask").textContent="";$("bkfile").value="";$("bkfile").click();};
function clean(list){
  var ok=[];(Array.isArray(list)?list:[]).forEach(function(x){
    if(!x||typeof x!=="object")return;
    var amt=Number(String(x.amt).replace(/,/g,"")),name=String(x.name||"").trim(),date=String(x.date||"");
    if(!name||!(amt>0)||!/^\d{4}-\d{2}-\d{2}$/.test(date))return;
    ok.push({id:String(x.id||newId()),name:name,rel:x.rel||"기타",ev:EVS.indexOf(x.ev)>=0?x.ev:"기타",date:date,amt:amt,dir:x.dir==="받았음"?"받았음":"냈음"});
  });return ok;
}
function same(a,b){return a.name===b.name&&a.date===b.date&&a.amt===b.amt&&a.dir===b.dir&&a.ev===b.ev;}
function apply(list,mode){
  stopEdit(true);pending=null;
  if(mode==="replace"){items=list;}
  else{var add=0;list.forEach(function(x){
      if(items.some(function(y){return y.id===x.id||same(x,y);}))return;
      items.push(x);add++;});}
  save();render();$("bkask").textContent="";
  bksay(mode==="replace"?"백업으로 바꿨어요 ✔ 지금 "+items.length+"줄이에요.":"합쳤어요 ✔ 새로 "+add+"줄이 더해져 지금 "+items.length+"줄이에요. (이미 있던 줄은 건너뛰었어요)");
}
$("bkfile").addEventListener("change",function(){
  var f=this.files&&this.files[0];if(!f)return;
  var isX=/\.xlsx?$/i.test(f.name);
  var rd=new FileReader();
  rd.onload=function(){
    if(isX){bksay("엑셀 파일을 읽는 중이에요…");needXLSX(function(){
      var list;try{var wb=XLSX.read(rd.result,{type:"array",cellDates:true});
        list=clean(fromRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:""})));}catch(e){list=[];}
      ask(list);});return;}
    var list,t=decode(rd.result);
    try{var s=t.replace(/^﻿/,"").trim();
      if(s[0]==="{"||s[0]==="["){var d=JSON.parse(s);list=clean(Array.isArray(d)?d:d.items);}  // 예전 백업 파일도 읽기
      else list=clean(fromCSV(t));}catch(e){list=[];}
    ask(list);
  };
  rd.readAsArrayBuffer(f);
});
function ask(list){
    if(!list.length){bksay("이 파일에서 장부 기록을 찾지 못했어요. '백업 받기'로 받은 파일인지 확인해 주세요.",true);return;}
    if(!items.length){apply(list,"replace");return;}
    var box=$("bkask");box.textContent="";
    var q=el("div","ask");
    q.appendChild(el("b","","파일에 "+list.length+"줄, 지금 장부에 "+items.length+"줄이 있어요. 어떻게 할까요? (엑셀에서 고친 파일이면 '바꾸기'를 고르세요)"));
    var m=el("button","small","합치기 — 지금 기록은 두고 더하기");m.type="button";m.onclick=function(){apply(list,"merge");};
    var r=el("button","small danger","바꾸기 — 지금 기록은 지워져요");r.type="button";
    r.onclick=function(){if(confirm("지금 장부 "+items.length+"줄이 모두 지워지고 백업 내용으로 바뀝니다. 바꿀까요?"))apply(list,"replace");};
    var c=el("button","small ghost","그만두기");c.type="button";c.onclick=function(){box.textContent="";bksay("불러오기를 그만뒀어요. 장부는 그대로예요.");};
    q.appendChild(m);q.appendChild(r);q.appendChild(c);box.appendChild(q);
    bksay("");
}
$("date").value=today();
load();render();
